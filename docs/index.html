<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摩天靈骨塔祭拜預約</title><link rel="stylesheet" href="style.css"><script type="module" src="script.js?v=booking-2"></script></head>
<body><header><p>ESP32 智慧摩天輪專題</p><h1>摩天靈骨塔祭拜預約</h1><p>先確認祭拜對象，再選擇一小時時段。</p><nav aria-label="頁面切換"><a href="#booking">祭拜預約</a>　<a href="#onsite">現場操作</a></nav></header>
<main id="booking"><section><h2>建立預約</h2><p>每日 08:00～18:00（臺灣時間），每個整點時段限一筆。</p>
<form id="book"><label for="plaque">牌位編號</label><input id="plaque" required maxlength="24" placeholder="例如 0001"><button type="button" id="confirmPlaque">確認祭拜對象</button><p id="plaqueResult" role="status"></p><label for="day">預約日期</label><input id="day" type="date" required><fieldset><legend>可預約時段</legend><div id="slots" class="slots"></div></fieldset><button id="submit" disabled>確認預約</button></form>
<p id="notice" role="status"></p><div id="receipt" hidden><strong>請保存預約編號</strong><input id="receiptId" readonly aria-label="預約編號"><button id="copy" type="button">複製編號</button></div></section>
<section><h2>查詢預約</h2><p>輸入建立預約時取得的完整編號。</p><form id="query"><label for="id">預約編號</label><input id="id" required maxlength="34" placeholder="R-…" autocomplete="off" spellcheck="false"><button>查詢</button></form><p id="result" role="status"></p><a id="admin" hidden>管理員入口</a></section></main>
<main id="onsite" hidden><section><h2>現場操作</h2><p>先用牌位編號查時段。操作時請輸入預約成功時取得的 R-… 編號。</p>
<form id="onsiteForm"><label for="onsiteCode">牌位編號</label><input id="onsiteCode" required maxlength="24" placeholder="例如 0001"><button>查詢時段</button></form>
<p id="onsiteResult" role="status"></p><div id="onsiteControls" hidden><label for="onsiteId">預約編號</label><input id="onsiteId" maxlength="34" autocomplete="off" placeholder="R-…"><div id="onsiteActions"></div></div><p id="onsiteFeedback" role="status"></p><p>開始運轉目前僅測試流程，不控制馬達。</p></section></main>
<footer>所有時間以臺灣時間顯示</footer></body></html>
